[package]
name = "ttf2ufo"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/JLHwung/ttf2ufo"
description = "Extract a UFO from a TrueType font, byte for byte like ufo-extractor's extractufo"
keywords = ["font", "ufo", "truetype", "ttf"]
categories = ["command-line-utilities"]

[dependencies]
indexmap = "2.14.2"
itoa = "1.0.19"
rayon = "1.12.0"
read-fonts = "0.47"
sha2 = "0.11.0"
