name: Publish

# Publishes to crates.io with Trusted Publishing (OIDC): no API token is
# stored in the repository. Push a tag matching the Cargo.toml version,
# e.g. `git tag v0.1.0 && git push origin v0.1.0`.

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches Cargo.toml version
        run: |
          version=$(cargo metadata --format-version 1 --no-deps --locked \
            | jq -r '.packages[] | select(.name == "ttf2ufo") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - run: cargo test --locked

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
